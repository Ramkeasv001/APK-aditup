[package]
name = "aditup-desktop"
version = "0.1.0"
description = "ADITUP — HSE Observation & Recommendation Platform (Mode 1: rule-based + self-learning engine)"
authors = ["HSE-DEPT"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aditup_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aditup-db = { path = "../../../crates/db" }
aditup-security = { path = "../../../crates/security" }
aditup-scoring-engine = { path = "../../../crates/scoring-engine" }
aditup-recommendation-provider = { path = "../../../crates/recommendation-provider" }
aditup-kle = { path = "../../../crates/kle" }
aditup-export = { path = "../../../crates/export" }
aditup-backup = { path = "../../../crates/backup" }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

[dev-dependencies]
# Enables `cargo test` inside src-tauri for Rust-side unit tests (Module 15 will expand this).

