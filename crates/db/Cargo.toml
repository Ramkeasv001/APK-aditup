[package]
name = "aditup-db"
version = "0.1.0"
description = "Encrypted SQLite (SQLCipher) storage layer: connection, migrations, repositories."
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# vendored-openssl builds both SQLCipher and OpenSSL from source, so the app
# doesn't depend on any system SQLCipher/OpenSSL install being present on the
# target machine — important for a portable enterprise desktop deployment.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
