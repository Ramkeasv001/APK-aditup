[package]
name = "aditup-security"
version = "0.1.0"
description = "Argon2id auth, session vault, admin elevation, recovery-key flow."
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
aditup-db = { path = "../db" }
argon2 = "0.5"
# argon2's re-exported rand_core doesn't enable `getrandom` (which is what
# provides OsRng) on its own — Cargo's feature unification needs a direct
# dependency here to turn it on for the shared rand_core in the build graph.
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
